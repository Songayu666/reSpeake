<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>reSpeake · 声音方向雷达</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">RESPEAKER LAB</span><h1>声音方向雷达</h1></div>
      <div id="status" class="status"><i></i> 正在连接设备</div>
    </header>
    <section class="dashboard">
      <div class="radar-card">
        <div id="radar" class="radar">
          <span class="axis north">0°</span><span class="axis east">90°</span>
          <span class="axis south">180°</span><span class="axis west">270°</span>
          <div class="sweep"></div><div id="beam" class="beam"></div>
          <div class="core"><span id="angle">000°</span><small>DOA</small></div>
        </div>
      </div>
      <aside>
        <article><label>语音活动</label><strong id="voice">安静</strong><div id="voiceDot" class="voice-dot"></div></article>
        <article><label>真实音频强度</label><strong id="levelText">0%</strong><small id="dbfs">-96.0 dBFS</small><div class="meter"><span id="meter"></span></div></article>
        <article><label>最近方向</label><div id="history" class="history"></div></article>
        <article class="timeline-card"><label>语音时间线</label><strong id="recordingState">等待语音</strong><div id="timeline" class="timeline"><p>说话后将自动保存本地 WAV</p></div></article>
      </aside>
    </section>
    <footer id="footer">说话时，雷达和 ReSpeaker 灯环会锁定声源方向</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
